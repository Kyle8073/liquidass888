name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: "scheme"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - rootless
          - rootful
          - roothide

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel

    env:
      DEVICE_TARGET: "iphone:clang:16.5:14.0"
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: cache sdks
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-16.5-v2

      - name: download sdks
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-master
          git -C sdks-master sparse-checkout set iPhoneOS16.5.sdk
          if [ ! -d sdks-master/iPhoneOS16.5.sdk ]; then
            git -C sdks-master sparse-checkout disable
          fi
          mkdir -p theos/sdks
          mv sdks-master/*.sdk theos/sdks/
          rm -rf sdks-master

      - name: set THEOS env var
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: install deps
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: build schemes
        run: |
          set -euo pipefail
          INPUT_SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$INPUT_SCHEME" ] || [ "$INPUT_SCHEME" = "all" ]; then
            SCHEMES="rootless rootful roothide"
          else
            SCHEMES="$INPUT_SCHEME"
          fi

          rm -rf dist
          for SCHEME in $SCHEMES; do
            echo "=== Building scheme: $SCHEME ==="
            if [ "$SCHEME" = "rootful" ]; then
              SCHEME_FLAG="THEOS_PACKAGE_SCHEME="
            else
              SCHEME_FLAG="THEOS_PACKAGE_SCHEME=$SCHEME"
            fi
            make clean || true
            rm -rf .theos packages LiquidAssBackboardd/.theos LiquidAssRWB/.theos LiquidAssPrefs/.theos
            make package \
              ARCHS="arm64 arm64e" \
              TARGET="$DEVICE_TARGET" \
              FINALPACKAGE=1 \
              "$SCHEME_FLAG"
            mkdir -p "dist/$SCHEME"
            cp packages/*.deb "dist/$SCHEME/"
          done
          ls -la dist/*/*.deb

      - name: upload packages
        uses: actions/upload-artifact@v4
        with:
          name: liquidass-packages
          path: dist/*/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: liquidass-packages
          path: ./all-packages

      - name: flatten deb packages
        run: |
          mkdir -p ./release-debs
          find ./all-packages -type f -name '*.deb' -exec cp -f {} ./release-debs/ \;
          ls -la ./release-debs

      - name: update nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release-debs/*.deb"
          allowUpdates: true
          tag: nightly
          name: "Nightly"
          body: |
            This build was automatically generated from the latest commit on `main`.
            
            **Commit SHA:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}
            
            > [!NOTE]
            > A nightly build is basically the next update partially done. Additionally, this build might have the old version number but the code itself should has the latest commit.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
